name: inspect
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "space separated class names (dots)"
        required: true
      grep:
        description: "resource path regex"
        required: false
        default: "textures/gui/title"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - run: gradle compileJava --offline || gradle compileJava
      - name: dump
        run: |
          JAR=$(find ~/.gradle -name 'minecraft-*merged*.jar' -o -name 'minecraft-clientOnly*.jar' -o -name 'minecraft-client*.jar' | grep -v sources | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle .gradle -path '*minecraft*' -name '*.jar' -size +10M | grep -v sources | head -1)
          echo "JAR=$JAR"
          find ~/.gradle .gradle -path '*minecraft*' -name '*.jar' -size +5M 2>/dev/null | head
          unzip -l "$JAR" | grep -E "${{ github.event.inputs.grep }}" | head -80
          for c in ${{ github.event.inputs.classes }}; do
            echo "===== $c"
            javap -p -cp "$JAR" "$c" | head -150
          done
